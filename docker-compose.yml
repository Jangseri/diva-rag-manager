services:
  rag-manager:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: diva-rag-manager
    # 호스트에서 /data/diva 를 소유한 계정의 uid:gid.
    # 신규 서버에서는 `id <계정명>` 으로 확인 후 .env 에 APP_UID/APP_GID 를 지정하세요.
    user: "${APP_UID:-1007}:${APP_GID:-1012}"
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - ORIGIN_PATH=/data/diva/origin
      - EXTRACT_PATH=/data/diva/extract
      - ENABLE_REDIS_CONSUMER=true
      - MAX_FILE_SIZE_MB=100
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://192.168.220.223:3000}
    volumes:
      - /data/diva:/data/diva
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "7"
    restart: unless-stopped
    networks:
      rag-network:
        ipv4_address: 172.24.17.2

networks:
  rag-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.24.17.0/24
